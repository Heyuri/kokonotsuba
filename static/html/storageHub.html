<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>kk storage hub</title>
</head>
<body>
<script>
/* Cross-subdomain storage hub for Kokonotsuba.
 *
 * This page is hosted on STATIC_URL and embedded as a hidden iframe by every
 * board (see kkStore in koko.js). Because the iframe always runs on the single
 * STATIC_URL origin, its localStorage is shared by all boards regardless of
 * which subdomain they're served from. Boards talk to it over postMessage:
 *
 *   parent -> hub : {__kkstore, type:'init', keys:[...]}   register shared keys, get a snapshot
 *                   {__kkstore, type:'set', key, value}    persist a value
 *                   {__kkstore, type:'remove', key}        delete a value
 *   hub -> parent : {__kkstore, type:'snapshot', data:{}}  reply to init
 *                   {__kkstore, type:'change', key, value} a shared key changed (value null = removed)
 *
 * Cross-tab/cross-subdomain sync rides on the native `storage` event: a write in
 * one tab's hub fires `storage` in every other tab's hub (all same origin), and
 * each relays the change up to its own parent board page.
 */
(function () {
	'use strict';

	// Keys this hub is allowed to read/relay, populated by the parent's `init`.
	var sharedKeys = Object.create(null);

	// The (verified) origin of the board page that embedded us, learned from its
	// `init` message. We only ever relay changes back to this exact origin, so a
	// foreign site that frames the hub never receives another site's data.
	var parentOrigin = null;

	// Decide whether an origin is allowed to talk to us. We trust our own origin
	// and any sibling subdomain under the same registrable domain. The parent
	// domain is derived from OUR OWN hostname (which an attacker can't change),
	// never from anything the caller sends — so a foreign site framing this hub
	// can't trick it into serving another site's data.
	function allowedOrigin(origin) {
		if (!origin || origin === 'null') return false;
		var u;
		try { u = new URL(origin); } catch (e) { return false; }
		if (u.protocol !== location.protocol) return false;

		var host = u.hostname;
		var self = location.hostname;
		if (host === self) return true;

		var parts = self.split('.');
		var parent = (parts.length > 2 ? parts.slice(1).join('.') : self);
		return host === parent || host.endsWith('.' + parent);
	}

	function snapshot() {
		var data = {};
		Object.keys(sharedKeys).forEach(function (k) {
			try {
				var v = localStorage.getItem(k);
				if (v !== null) data[k] = v;
			} catch (e) {}
		});
		return data;
	}

	/* Rapid-fire circuit breaker (mirror of the one in kkStore, koko.js).
	 *
	 * No key legitimately changes more than a few times a second. If writes or relays for
	 * a key arrive at a sustained rapid rate — a feedback loop between tabs, a stuck
	 * writer — drop them for a cooldown instead of amplifying the flood to every other
	 * tab. Store state may go briefly stale; the next genuine change re-syncs it. */
	var FLOOD_WINDOW_MS = 2000;
	var FLOOD_LIMIT = 25;
	var FLOOD_COOLDOWN_MS = 10000;
	var floodCounts = Object.create(null);

	function floodGuard(dirKey) {
		var now = Date.now();
		var f = floodCounts[dirKey];
		if (!f) { f = floodCounts[dirKey] = { count: 0, windowStart: now, blockedUntil: 0 }; }
		if (now < f.blockedUntil) return true;
		if (now - f.windowStart > FLOOD_WINDOW_MS) { f.windowStart = now; f.count = 0; }
		if (++f.count > FLOOD_LIMIT) {
			f.blockedUntil = now + FLOOD_COOLDOWN_MS;
			return true;
		}
		return false;
	}

	window.addEventListener('message', function (e) {
		if (!allowedOrigin(e.origin)) return;
		var d = e.data;
		if (!d || d.__kkstore !== 1 || !e.source) return;

		switch (d.type) {
			case 'init':
				parentOrigin = e.origin;
				if (Array.isArray(d.keys)) {
					d.keys.forEach(function (k) {
						if (typeof k === 'string') sharedKeys[k] = true;
					});
				}
				e.source.postMessage({ __kkstore: 1, type: 'snapshot', data: snapshot() }, e.origin);
				break;

			case 'set':
				if (typeof d.key === 'string' && sharedKeys[d.key]) {
					try {
						var next = String(d.value);
						// A no-op write can't inform anyone of anything; skipping it also
						// guarantees no storage event fires for it anywhere.
						if (localStorage.getItem(d.key) === next) break;
						if (floodGuard('set:' + d.key)) break;
						localStorage.setItem(d.key, next);
						// Confirm the write back to its own writer. Storage events don't
						// fire in the writing context, so without this the writer is the
						// one tab that never hears where its write landed in the hub's
						// order — racing writes from several tabs then leave its mirror
						// pinned on a stale value (and a stale poll-lock mirror makes
						// every tab poll and collide again on every cycle, forever). With
						// it, every tab receives the same ordered change stream and
						// converges; the writer's kkStore recognizes the echo.
						relayToParent(d.key, next);
					} catch (err) {}
				}
				break;

			case 'remove':
				if (typeof d.key === 'string' && sharedKeys[d.key]) {
					try {
						if (localStorage.getItem(d.key) === null) break;
						if (floodGuard('set:' + d.key)) break;
						localStorage.removeItem(d.key);
						relayToParent(d.key, null);
					} catch (err) {}
				}
				break;

			case 'sync':
				// Writer self-verification (see kkStore in koko.js): answer with the
				// authoritative current value so a tab whose mirror lost a write race can
				// repair itself. Answered as a normal 'change', which the page applies
				// (or no-ops when the mirror already matches).
				if (typeof d.key === 'string' && sharedKeys[d.key]) {
					try { relayToParent(d.key, localStorage.getItem(d.key)); } catch (err) {}
				}
				break;
		}
	});

	// Send one change up to the parent board page. Only ever sent to the verified parent
	// origin learned during `init`.
	function relayToParent(key, value) {
		if (!parentOrigin) return;
		if (!window.parent || window.parent === window) return;
		try {
			window.parent.postMessage(
				{ __kkstore: 1, type: 'change', key: key, value: value },
				parentOrigin
			);
		} catch (err) {}
	}

	// Relay changes made by other tabs (same origin) up to our parent board page.
	window.addEventListener('storage', function (e) {
		if (e.key === null) return; // localStorage.clear()
		if (!sharedKeys[e.key]) return;
		// A key relaying at an absurd sustained rate is a loop somewhere — stop feeding it.
		if (floodGuard('relay:' + e.key)) return;
		relayToParent(e.key, e.newValue);
	});
})();
</script>
</body>
</html>
